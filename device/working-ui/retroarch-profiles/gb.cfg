# Retro KiddOS Game Boy profile overlay.
# Base video, audio, controller, core, and save-directory settings remain inherited.


config_save_on_exit = "false"

# Keep the RetroArch menu inaccessible during Kid Mode gameplay.
input_menu_toggle = "nul"
input_menu_toggle_axis = "nul"
input_menu_toggle_btn = "nul"
input_menu_toggle_gamepad_combo = "0"
input_menu_toggle_mbtn = "nul"

# Save states are deferred; native in-game saves remain enabled.
input_save_state = "nul"
input_save_state_axis = "nul"
input_save_state_btn = "nul"
input_save_state_mbtn = "nul"
input_load_state = "nul"
input_load_state_axis = "nul"
input_load_state_btn = "nul"
input_load_state_mbtn = "nul"
savestate_auto_load = "false"
savestate_auto_save = "false"

# Disable the alternate desktop menu shortcut as well.
input_desktop_menu_toggle = "nul"
